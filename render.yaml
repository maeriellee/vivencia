services:
  - type: web
    name: vivencia
    runtime: docker
    rootDir: vibe-app
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Vivencia
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
